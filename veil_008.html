<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O C C U L T — Under the Veil</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Raleway:wght@100;200;300&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #060606;
      --ash: #f2ede4;
      --ember: #c8a96e;
      --dim: #6a6458;
      --rule: rgba(242,237,228,0.1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; min-height: 100%;
      background: var(--black); color: var(--ash);
      font-family: 'Cormorant Garamond', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    body, a { cursor: crosshair; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1.6rem 3rem;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(6,6,6,0.88);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .nav-wordmark {
      font-family: 'Raleway', sans-serif; font-weight: 100; font-size: 15px;
      letter-spacing: 0.55em; text-transform: uppercase;
      color: var(--ash); text-decoration: none;
    }
    .nav-links { display: flex; gap: 2.2rem; list-style: none; }
    .nav-links a {
      font-family: 'Raleway', sans-serif; font-weight: 200; font-size: 10px;
      letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--dim); text-decoration: none;
      transition: color 0.4s ease; position: relative;
    }
    .nav-links a::after {
      content: ''; position: absolute; bottom: -3px; left: 0;
      width: 0; height: 0.5px; background: var(--ember);
      transition: width 0.4s ease;
    }
    .nav-links a:hover { color: var(--ash); }
    .nav-links a:hover::after { width: 100%; }

    .hero {
      padding: 10rem 3rem 3rem;
      max-width: 900px; margin: 0 auto;
    }
    .hero .eyebrow {
      font-family: 'Raleway', sans-serif; font-weight: 200; font-size: 10px;
      letter-spacing: 0.35em; text-transform: uppercase;
      color: var(--ember); margin-bottom: 1.2rem;
    }
    .hero .eyebrow a {
      color: inherit; text-decoration: none;
      transition: opacity 0.3s ease;
    }
    .hero .eyebrow a:hover { opacity: 0.7; }
    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-style: italic;
      font-size: clamp(2.4rem, 6vw, 4.4rem);
      line-height: 1.05; color: var(--ash);
    }
    .issue-meta {
      display: flex; gap: 1.2rem; align-items: center;
      font-family: 'Raleway', sans-serif; font-weight: 200; font-size: 9px;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--dim); margin-top: 1.4rem;
    }
    .issue-meta .tag { color: var(--ember); }

    .content-row {
      max-width: 1200px; margin: 3rem auto 0;
      padding: 0 3rem;
      display: grid;
      grid-template-columns: 2.4fr 1fr;
      gap: 3rem;
      align-items: start;
    }

    .left-col { display: flex; flex-direction: column; gap: 2.4rem; }

    /* ---- Album-style track card ---- */
    .track-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 520px;
      overflow: hidden;
      border: 1px solid var(--rule);
      background: #000;
    }
    .track-card img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.75) saturate(0.9) grayscale(0.15);
    }
    .track-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: flex-end;
      background: linear-gradient(180deg, rgba(6,6,6,0) 40%, rgba(6,6,6,0.85) 100%);
      padding: 1.6rem;
    }
    .track-overlay-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-style: italic;
      font-size: 1.8rem; color: var(--ash);
      margin-bottom: 0.9rem;
    }
    .track-controls {
      display: flex; align-items: center; gap: 0.9rem;
    }
    .play-btn {
      width: 42px; height: 42px; flex-shrink: 0;
      border-radius: 50%;
      border: 1px solid rgba(242,237,228,0.4);
      background: rgba(6,6,6,0.4);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .play-btn:hover { background: rgba(200,169,110,0.25); border-color: var(--ember); }
    .play-btn svg { width: 14px; height: 14px; fill: var(--ash); }
    .track-progress {
      flex: 1; height: 2px;
      background: rgba(242,237,228,0.2);
      position: relative;
      cursor: pointer;
    }
    .track-progress-fill {
      position: absolute; top: 0; left: 0; height: 100%;
      width: 0%;
      background: var(--ember);
    }
    .track-time {
      font-family: 'Raleway', sans-serif; font-weight: 200; font-size: 9px;
      letter-spacing: 0.08em; color: var(--ash); opacity: 0.75;
      flex-shrink: 0; min-width: 34px; text-align: right;
    }

    .synopsis .label {
      font-family: 'Raleway', sans-serif; font-weight: 200; font-size: 9px;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--dim); margin-bottom: 1.2rem;
    }
    .synopsis p {
      font-size: clamp(1.05rem, 1.6vw, 1.25rem);
      line-height: 1.85; font-weight: 300;
      color: var(--ash); opacity: 0.85;
    }

    /* ---- Creator column ---- */
    .creator-col { display: flex; flex-direction: column; gap: 1.4rem; }
    .creator-photo {
      width: 100%; max-width: 160px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 1px solid var(--rule);
      background: #111;
    }
    .creator-photo img {
      width: 100%; height: 100%; object-fit: cover;
      filter: brightness(0.9) saturate(0.9) grayscale(0.1);
    }
    .creator-col .label {
      font-family: 'Raleway', sans-serif; font-weight: 200; font-size: 9px;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--dim);
    }
    .creator-quote {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-style: italic;
      font-size: 1.2rem; line-height: 1.6;
      color: var(--ash); opacity: 0.9;
    }
    .creator-name {
      font-family: 'Raleway', sans-serif; font-weight: 200; font-size: 10px;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--dim);
    }
    .creator-links { display: flex; gap: 1.2rem; }
    .creator-links a {
      font-family: 'Raleway', sans-serif; font-weight: 200; font-size: 9px;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--ember); text-decoration: none;
      border-bottom: 0.5px solid var(--ember);
      padding-bottom: 0.2rem;
      transition: opacity 0.3s ease;
    }
    .creator-links a:hover { opacity: 0.7; }

    .rule { height: 0.5px; background: var(--rule); margin: 4rem 3rem; }

    footer {
      padding: 2rem 3rem; border-top: 0.5px solid var(--rule);
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-mark {
      font-family: 'Raleway', sans-serif; font-weight: 100; font-size: 10px;
      letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim);
    }
    .footer-occult {
      font-family: 'Cormorant Garamond', serif; font-weight: 300;
      font-style: italic; font-size: 12px; color: var(--dim); letter-spacing: 0.1em;
    }

    @media (max-width: 700px) {
      nav { padding: 1.2rem 1.5rem; }
      .nav-links { gap: 1rem; }
      .hero, .content-row { padding-left: 1.5rem; padding-right: 1.5rem; }
      .rule { margin: 3rem 1.5rem; }
      .content-row { grid-template-columns: 1fr; }
      .creator-photo { max-width: 220px; margin: 0 auto; }
      .track-card { max-width: 100%; }
    }
  </style>
</head>
<body>
  <script src="loading.js"></script>

  <nav>
    <a href="Directory.html" class="nav-wordmark">Occult</a>
    <ul class="nav-links">
      <li><a href="under_the_veil.html">Under the Veil</a></li>
      <li><a href="kerosene.html">Kerosene</a></li>
      <li><a href="collaboration.html">Collaboration</a></li>
      <li><a href="contact.html">Contact / Newsletter</a></li>
      <li><a href="Directory.html">Directory</a></li>
    </ul>
  </nav>

  <section class="hero">
    <p class="eyebrow"><a href="under_the_veil.html">← Under the Veil</a></p>
    <h1>I Love You.</h1>
    <div class="issue-meta">
      <span class="tag">Music</span>
    </div>
  </section>

  <div class="content-row">
    <div class="left-col">

      <!-- Album-style track card: cover image with overlaid play controls -->
      <div class="track-card">
        <img src="i-love-you-cover.jpg" alt="I Love You — cover art">
        <div class="track-overlay">
          <p class="track-overlay-title">I Love You</p>
          <div class="track-controls">
            <div class="play-btn" id="playBtn">
              <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
            </div>
            <div class="track-progress" id="progressBar">
              <div class="track-progress-fill" id="progressFill"></div>
            </div>
            <span class="track-time" id="trackTime">0:00</span>
          </div>
        </div>
        <audio id="trackAudio" src="audio/I love you.m4a" preload="metadata"></audio></audio>
      </div>

      <div class="synopsis">
        
      </div>
    </div>

    <div class="creator-col">
      <div class="creator-photo">
        <img src="jacky-profile.jpg" alt="Jackyy">
      </div>
      <p class="label">Creator</p>
     
      <p class="creator-name">Jackyy</p>
      <div class="creator-links">
        <a href="https://www.instagram.com/jjyqin/">Instagram</a>
      </div>
    </div>
  </div>

  <div class="rule"></div>

  <footer>
    <span class="footer-mark">O C C U L T &nbsp;·&nbsp; 2026</span>
    <span class="footer-occult">Under the Veil</span>
  </footer>

  <script>
    const audio = document.getElementById('trackAudio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const trackTime = document.getElementById('trackTime');

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else {
        audio.pause();
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    });

    audio.addEventListener('timeupdate', () => {
      const pct = (audio.currentTime / audio.duration) * 100 || 0;
      progressFill.style.width = pct + '%';
      const mins = Math.floor(audio.currentTime / 60);
      const secs = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
      trackTime.textContent = `${mins}:${secs}`;
    });

    audio.addEventListener('ended', () => {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });
  </script>

</body>
</html>
