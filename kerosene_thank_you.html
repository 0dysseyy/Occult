<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — Occult</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Raleway:wght@100;200;300&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #060606;
      --ash: #f2ede4;
      --ember: #c8a96e;
      --dim: #6a6458;
      --rule: rgba(242,237,228,0.1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--black);
      color: var(--ash);
      font-family: 'Cormorant Garamond', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1.6rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(6,6,6,0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .nav-wordmark {
      font-family: 'Raleway', sans-serif;
      font-weight: 100; font-size: 15px;
      letter-spacing: 0.55em; text-transform: uppercase;
      color: var(--ash); text-decoration: none;
    }

    body, a { cursor: crosshair; }

    .center-wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem;
    }

    .section-tag {
      font-family: 'Raleway', sans-serif;
      font-weight: 200; font-size: 9px;
      letter-spacing: 0.35em; text-transform: uppercase;
      color: var(--ember); margin-bottom: 1.6rem;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-style: italic;
      font-size: clamp(2.4rem, 5vw, 4rem);
      line-height: 1.15; color: var(--ash);
      margin-bottom: 1.6rem;
      max-width: 18ch;
    }

    p.body-text {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-size: 1.15rem;
      line-height: 1.85; color: var(--ash);
      opacity: 0.8; max-width: 480px;
      margin-bottom: 2.6rem;
    }

    .return-link {
      font-family: 'Raleway', sans-serif;
      font-weight: 200; font-size: 10px;
      letter-spacing: 0.35em; text-transform: uppercase;
      color: var(--ash); text-decoration: none;
      border-bottom: 0.5px solid var(--ember);
      padding-bottom: 0.4rem;
      transition: color 0.3s ease;
    }

    .return-link:hover { color: var(--ember); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .center-wrap { animation: fadeUp 1.2s ease both; }
  </style>
</head>
<body>

  <nav>
    <a href="Directory.html" class="nav-wordmark">OCCULT</a>
  </nav>

  <div class="center-wrap">
    <p class="section-tag">Received</p>
    <h1>Thank you for your response.</h1>
    <p class="body-text">
      We've got it. We read everything that comes through, and we'll get back to you shortly.
    </p>
    <a href="Directory.html" class="return-link">Return Home</a>
  </div>

</body>
</html>
